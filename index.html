<title>אינדקס צמחי מרפא</title><style>
@font-face{font-family:"Frank Ruhl Libre";font-weight:300 900;font-display:swap;src:url(fonts/frank-hebrew.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Frank Ruhl Libre";font-weight:300 900;font-display:swap;src:url(fonts/frank-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
:root{--bg:#f7f1e3;--card:#fffaf0;--ink:#3b2f25;--mute:#857668;--acc:#5f7a4e;--acc-ink:#fffaf0;--olive:#6f7140;--head:#4a5a36;--terra:#b8623e;--sage:#e1e8d4;--chip:#f2ead9;--line:#ebdfc8;--ok:#5f7a4e;--bad:#b4502f;--mid:#a0782a;--sh:0 1px 2px rgba(90,60,30,.06),0 8px 24px rgba(90,60,30,.08);--serif:"Frank Ruhl Libre",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root{--bg:#1a1712;--card:#24201a;--ink:#efe6d6;--mute:#a89a88;--acc:#a9bf8e;--acc-ink:#1a1712;--olive:#b9b884;--head:#c3d2a6;--terra:#e08a64;--sage:#2e3324;--chip:#2d2820;--line:#3a3329;--ok:#a9bf8e;--bad:#ea9378;--mid:#dcbc6a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
/* hero */
.hero{display:flex;align-items:center;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 16px 6px;max-width:1100px;margin:auto}
.hero .logo{width:44px;height:44px;flex:none;color:var(--olive)}
.hero .art{position:absolute;inset-inline-end:-6px;top:calc(env(safe-area-inset-top) + 2px);width:128px;height:110px;color:var(--olive);opacity:.55;pointer-events:none}
.hero .art .t{color:var(--terra)}
h1{margin:0;font:700 28px/1.1 var(--serif);color:var(--head);letter-spacing:.2px}
.hero .sub{color:var(--mute);font-size:13px;margin-top:2px}
#cnt{color:var(--mute);font-size:13px}
/* sticky bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 16px 8px}
.top>*{max-width:1100px;margin-inline:auto}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute);pointer-events:none}
input{width:100%;padding:12px 44px;border:0;border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;box-shadow:var(--sh);outline:none}
input:focus{box-shadow:0 0 0 2px var(--acc),var(--sh)}
input::placeholder{color:var(--mute)}
#qx{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:var(--chip);width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--mute);display:none}
.search.has #qx{display:block}
.flt{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.flt::-webkit-scrollbar{display:none}
.flt button{flex:none;font-size:13.5px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap}
.flt button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
/* TCM filter */
.tcmf{margin-top:8px;border-radius:14px;background:var(--card);box-shadow:var(--sh);padding:0 14px}
.tcmf[open]{max-height:50vh;overflow:auto;padding-bottom:10px}
.tcmf>summary{list-style:none;cursor:pointer;padding:9px 0;font-weight:600;color:var(--acc);font-size:14px;display:flex;align-items:center;gap:6px}
.tcmf>summary::-webkit-details-marker{display:none}
.tcmf>summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border:solid var(--mute);border-width:0 0 2px 2px;transform:rotate(-45deg);transition:transform .2s}
.tcmf[open]>summary::after{transform:rotate(135deg)}
#tcmn{font-weight:400;color:var(--mute);font-size:13px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}
.grp b{width:100%;color:var(--mute);font-weight:600;font-size:12px}
.grp button,.sim,#simbar button{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.grp button i{font-style:normal;color:var(--mute);font-size:11px}
.grp button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.grp button.on i{color:inherit}
.hint{color:var(--mute);font-size:12px}.clr{border-style:dashed!important}
#simbar{margin-top:8px;padding:10px 14px;border-radius:14px;background:var(--sage);font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#simbar[hidden]{display:none}
/* cards */
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;padding:8px 16px 16px;max-width:1100px;margin:auto}
article{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden;align-self:start}
article.ref{box-shadow:0 0 0 2px var(--acc),var(--sh)}
article header{padding:16px 18px 4px;cursor:pointer;position:relative}
h2{margin:0;font:700 22px/1.25 var(--serif);color:var(--ink)}
.ill{position:absolute;inset-inline-end:14px;top:12px;width:46px;height:46px;color:var(--olive);opacity:.7}
.ill .t{color:var(--terra)}
.lat{color:var(--mute);font:italic 500 15px/1.4 var(--serif);text-align:right}
.part{font-size:12.5px;color:var(--olive);margin-top:2px}
.sum{padding:6px 18px 14px;cursor:pointer}
.more{display:none;padding:0 18px 16px;border-top:1px solid var(--line)}
article.open .more{display:block}
h3{font-size:12px;margin:14px 0 6px;color:var(--mute);font-weight:600;letter-spacing:.2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{background:var(--chip);border-radius:8px;padding:2px 9px;font-size:13px}
.chips.main span{background:var(--sage);color:var(--ink)}
@media (prefers-color-scheme:dark){.chips.main span{color:var(--acc)}}
p{margin:0;font-size:14px}
.safe{background:color-mix(in srgb,var(--bad) 8%,var(--card));border-inline-start:3px solid var(--bad);border-radius:10px;padding:10px 12px;margin-top:14px}
.safe h3{margin:0 0 4px;color:var(--bad)}
.pl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
.pl b{font-weight:600;border:1px solid currentColor;border-radius:999px;padding:1px 10px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mid{color:var(--mid)}
.more details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.more summary{cursor:pointer;font-weight:600;color:var(--acc);font-size:14px}
.ic{display:inline-block;width:1.3em;text-align:center}
.q{font-size:13px;margin:8px 0}.act{font-weight:600;font-size:13px;margin-top:10px}
ul{margin:4px 0;padding-inline-start:18px;font-size:13px}
ul.comp{list-style:none;padding:0}ul.comp li{margin:2px 0}ul.comp li.sub{padding-inline-start:14px;color:var(--mute)}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.tg span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px}.tg span.a{background:var(--chip)}
.sim{margin:4px 0 8px;color:var(--acc);border-color:var(--acc)!important}
.score{display:inline-block;font:600 12px/1.6 system-ui,sans-serif;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:0 8px;margin-inline-start:8px;vertical-align:middle}
.note{max-width:1100px;margin:4px auto 0;padding:0 20px 20px;color:var(--mute);font-size:12.5px;text-align:center}
/* bottom nav */
nav{position:fixed;inset-inline:0;bottom:0;z-index:6;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 -4px 20px rgba(70,55,25,.08);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);padding:4px 14px;cursor:pointer;min-width:72px}
nav svg{width:22px;height:22px}
nav button:active{color:var(--acc)}
@media (min-width:900px){nav{display:none}body{padding-bottom:0}}
@media (max-width:400px){main{grid-template-columns:1fr}}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.sum h3:first-child{margin-top:4px}
.toggle{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:600;color:var(--terra)}
.toggle::before{content:"עוד פרטים"}article.open .toggle::before{content:"פחות פרטים"}
.toggle::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 0 2px 2px;transform:rotate(-45deg) translateY(-2px);transition:transform .2s}
article.open .toggle::after{transform:rotate(135deg)}
.more summary .ic{color:var(--terra)}
h3{color:var(--olive)}
.flt button.on,.grp button.on{background:var(--head);border-color:var(--head);color:var(--acc-ink)}
@media (prefers-color-scheme:dark){.flt button.on,.grp button.on{background:var(--acc);border-color:var(--acc)}}
.score{background:var(--terra)}
nav button:active,nav button:hover{color:var(--terra)}
.divider{display:block;width:60px;height:10px;margin:16px auto 0;color:var(--olive);opacity:.6}
</style></head><body>
<div class="hero"><div><h1>צמחי מרפא</h1><div class="sub">אינדקס של ראן בוטניקס · <span id="cnt"></span></div></div></div>

 <i>125</i></button><button type="button" data-k="a" data-v="מסלק ליחה / מכייח">מסלק ליחה / מכייח <i>39</i></button><button type="button" data-k="a" data-v="מסלק רוח">מסלק רוח <i>64</i></button><button type="button" data-k="a" data-v="מחמם / מגרש קור">מחמם / מגרש קור <i>42</i></button><button type="button" data-k="a" data-v="מסלק רעילות">מסלק רעילות <i>76</i></button><button type="button" data-k="a" data-v="מרגיע נפש / שן">מרגיע נפש / שן <i>24</i></button><button type="button" data-k="a" data-v="סופח / עוצר הפרשות ודימום">סופח / עוצר הפרשות ודימום <i>37</i></button><button type="button" data-k="a" data-v="מלחלח / מייצר נוזלים">מלחלח / מייצר נוזלים <i>20</i></button><button type="button" data-k="a" data-v="מקל על כאב">מקל על כאב <i>25</i></button><button type="button" data-k="a" data-v="מסלק גודש / מנקז">מסלק גודש / מנקז <i>38</i></button><button type="button" data-k="a" data-v="מייזע">מייזע <i>12</i></button><button type="button" data-k="a" data-v="מאזן מחזור / רחם">מאזן מחזור / רחם <i>48</i></button></div><div class="grp"><button type="button" id="tcmclr" class="clr">נקה סינון סיני</button><span class="hint">בחירה של כמה תגיות מציגה רק צמחים שיש להם את כולן.</span></div></details><div id="simbar" hidden></div></div>

<script>
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'}[c]));
function searchText(h){if(h.s!=null)return h.s;const[lat,...en]=h.lat.split(' · ');
 const t=h.tcm.map(b=>b.q!=null?b.q+' '+b.v:'• '+b.a+b.li.map(x=>'\n   - '+x).join('')).join('\n');
 const comp=h.comp.map(([s,x])=>(s?'- ':'')+x).join('\n');
 return [lat,h.n,en.join(' · '),h.main.join(', '),h.sec.join(', '),t,comp].join(' ').toLowerCase()}
const chips=(t,cls,a)=>a.length?'<h3>'+t+'</h3><div class="'+cls+'">'+a.map(x=>'<span>'+E(x)+'</span>').join('')+'</div>':'';
function card(h,i){return '<article data-i="'+i+'" data-p="'+E(h.p)+'" data-s="'+E(searchText(h))+'">'+
 '<header><h2>'+E(h.n)+'</h2><div class="lat" dir="ltr">'+E(h.lat)+'</div><div class="part">'+E(h.part)+'</div></header>'+
 '<div class="sum">'+chips('שימושים מקובלים עיקריים','chips main',h.main)+
 '<div class="pl"><b class="'+h.preg[0]+'">'+E(h.preg[1])+'</b><b class="'+h.nurse[0]+'">'+E(h.nurse[1])+'</b></div><span class="toggle"></span></div>'+
 '<div class="more">'+chips('שימושים מקובלים משניים','chips',h.sec)+chips('השפעה ידועה בספרות המקצועית','chips',h.eff)+
 '<div class="safe"><h3>בטיחות וזהירות</h3><p>'+E(h.safe)+'</p></div>'+
 '<details><summary><span class="ic">☯</span> במבט סיני מסורתי</summary><div class="tg"></div><button class="sim" type="button">הצג צמחים דומים במבט הסיני</button>'+
 h.tcm.map(b=>b.q!=null?'<div class="q"><b>'+E(b.q)+'</b> '+E(b.v)+'</div>':'<div class="act">'+E(b.a)+'</div><ul>'+b.li.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>').join('')+'</details>'+
 '<details><summary><span class="ic">⌬</span> רכיבים פעילים</summary><ul class="comp">'+h.comp.map(([s,x])=>'<li class="'+(s?'sub':'')+'">'+E(x)+'</li>').join('')+'</ul></details></div></article>'}
(async()=>{let HERBS;try{const r=await fetch("herbs-data.json");if(!r.ok)throw new Error(r.status);HERBS=await r.json()}
catch(e){document.getElementById("load").textContent="לא ניתן לטעון את herbs-data.json. יש לפתוח את הדף דרך שרת (http/https) ולא ישירות מהקובץ.";return}
const main=document.querySelector("main");main.innerHTML=HERBS.map(card).join("");
main.addEventListener("click",e=>{if(!e.target.closest("header,.sum"))return;const a=e.target.closest("article");a.classList.toggle("open")});
{const q=document.getElementById('q'),a=[...document.querySelectorAll('article')],c=document.getElementById('cnt');let part='';
function go(){const v=q.value.trim().toLowerCase();let n=0;a.forEach(x=>{const ok=(!v||x.dataset.s.includes(v))&&(!part||x.dataset.p.includes(part));x.style.display=ok?'':'none';n+=ok});c.textContent=n+' צמחים'}
q.oninput=go;document.getElementById('f').onclick=e=>{const b=e.target.closest('button');if(!b)return;part=b.dataset.v;document.querySelectorAll('#f button').forEach(x=>x.classList.toggle('on',x===b));go()};go();}

(()=>{const D=HERBS.map(h=>Object.assign({},h.c,{n:h.n}));
const A=[...document.querySelectorAll('article')],main=document.querySelector('main'),q=document.getElementById('q'),cnt=document.getElementById('cnt'),bar=document.getElementById('simbar');
const sel={t:new Set(),m:new Set(),l:new Set(),a:new Set()};let part='',simRef=null,simScore=null;
A.forEach((x,i)=>{const d=D[i],tg=x.querySelector('.tg');if(tg)tg.innerHTML=[...d.t,...d.m,...d.l].map(v=>'<span>'+v+'</span>').join('')+d.a.map(v=>'<span class="a">'+v+'</span>').join('');
 const b=x.querySelector('.sim');if(b)b.onclick=()=>similar(i);});
function score(i,j){const a=D[i],b=D[j];let s=0,max=0;for(const[k,w]of[['t',2],['m',2],['l',1],['a',3]]){const A1=new Set(a[k]),B=new Set(b[k]);const u=new Set([...A1,...B]).size;if(!u)continue;let inter=0;A1.forEach(v=>B.has(v)&&inter++);s+=w*inter/u;max+=w}return max?Math.round(100*s/max):0}
function similar(i){simRef=i;simScore=D.map((_,j)=>j===i?101:score(i,j));
 bar.hidden=false;bar.innerHTML='מציג צמחים דומים ל<b>'+D[i].n+'</b> במבט הסיני, מהדומה ביותר (התאמה בטעם, בטמפרטורה, בלחות ובפעולות) <button type="button" id="simx">✕ חזרה לרשימה הרגילה</button>';
 document.getElementById('simx').onclick=()=>{simRef=null;simScore=null;bar.hidden=true;A.forEach(x=>{x.classList.remove('ref');x.querySelectorAll('.score').forEach(s=>s.remove())});A.forEach(x=>main.appendChild(x));run()};
 [...A].sort((x,y)=>simScore[y.dataset.i]-simScore[x.dataset.i]).forEach(x=>main.appendChild(x));
 A.forEach(x=>{x.classList.toggle('ref',+x.dataset.i===i);x.querySelectorAll('.score').forEach(s=>s.remove());const s=simScore[x.dataset.i];if(+x.dataset.i!==i){const e=document.createElement('span');e.className='score';e.textContent=s+'% דמיון';x.querySelector('h2').appendChild(e)}});
 run();window.scrollTo({top:0,behavior:'smooth'})}
function run(){const v=q.value.trim().toLowerCase();let n=0;
 A.forEach(x=>{const d=D[x.dataset.i];let ok=(!v||x.dataset.s.includes(v))&&(!part||x.dataset.p.includes(part));
  for(const k in sel)for(const t of sel[k])if(!d[k].includes(t))ok=false;
  if(simScore&&+x.dataset.i!==simRef&&simScore[x.dataset.i]<40)ok=false;
  x.style.display=ok?'':'none';n+=ok});
 cnt.textContent=n+' צמחים';const k=Object.values(sel).reduce((s,x)=>s+x.size,0);document.getElementById('tcmn').textContent=k?'('+k+' נבחרו)':''}
document.getElementById('tcmf').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='tcmclr'){for(const k in sel)sel[k].clear();document.querySelectorAll('#tcmf button.on').forEach(x=>x.classList.remove('on'));run();return}
 const s=sel[b.dataset.k];s.has(b.dataset.v)?s.delete(b.dataset.v):s.add(b.dataset.v);b.classList.toggle('on');run()});
q.oninput=run;document.getElementById('f').onclick=e=>{const b=e.target.closest('button');if(!b)return;part=b.dataset.v;document.querySelectorAll('#f button').forEach(x=>x.classList.toggle('on',x===b));run()};
run();})();

const q=document.getElementById("q"),sb=q.parentNode,top=document.getElementById("top"),tf=document.getElementById("tcmf");
const syncX=()=>sb.classList.toggle("has",!!q.value);q.addEventListener("input",syncX);
document.getElementById("qx").onclick=()=>{q.value="";q.dispatchEvent(new Event("input"));q.focus()};
const toTop=()=>scrollTo({top:0,behavior:"smooth"});
document.getElementById("nq").onclick=()=>{toTop();q.focus({preventScroll:true})};
document.getElementById("nt").onclick=()=>{tf.open=!tf.open;if(tf.open)toTop()};
document.getElementById("nu").onclick=toTop;
})();
if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script></body></html>
