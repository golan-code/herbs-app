<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ee"><meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="icon" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>ניהול גישה</title>
<link rel="stylesheet" href="app.css">
<style>
body{padding:0 0 40px;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 4px}
header h1{font:700 24px/1.2 var(--serif);color:var(--green);margin:0}
header .who{font-size:12.5px;color:var(--mute);text-align:left}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-top:14px}
.card h2{font-size:16px;margin:0 0 12px;color:var(--green)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1;min-width:110px}
.row>div.grow{flex:2;min-width:180px}
.b{flex:none;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:99px;padding:10px 16px;background:var(--green);color:var(--on-green);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.b.alt{background:var(--chip);color:var(--green)}
.b.wa{background:#1f8a4c;color:#fff}
.b.warn{background:#f6e6e1;color:var(--bad)}
.b.sm{padding:6px 11px;font-size:13px;font-weight:500}
.b:disabled{opacity:.5}
.out{margin-top:12px;padding:12px;border-radius:12px;background:var(--th);display:none}
.out code{display:block;direction:ltr;text-align:left;word-break:break-all;font-size:13px;margin-bottom:10px}
.out .row{gap:8px}
.list{display:flex;flex-direction:column;gap:10px}
.inv{border:1px solid var(--line);border-radius:14px;padding:12px}
.inv .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.inv .name{font-weight:700;font-size:16px}
.inv .meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;color:var(--ink2);margin:8px 0 10px}
.inv .meta span:nth-child(odd){color:var(--mute)}
.inv .acts{display:flex;flex-wrap:wrap;gap:6px}
.st{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.st.ok{background:#e3f0e6;color:var(--ok)}.st.wait{background:#fbf3dc;color:var(--mid)}
.st.lock{background:#f6e6e1;color:var(--bad)}.st.exp{background:var(--chip);color:var(--mute)}
.msg{font-size:14px;color:var(--mute);margin:8px 0 0}
.err{color:var(--bad)}
.center{text-align:center;padding:48px 16px}
.center p{color:var(--ink2)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.filters button.on{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head><body>
<div class="wrap" id="app"><p class="center">טוען…</p></div>
<script type="module" src="js/admin.js"></script>
</body></html>
